# CI workflow for complytime-providers.
# Builds all provider binaries and runs unit tests.

name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    build-and-test:
        name: Build and test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: './go.mod'
                  cache: false

            - name: Build providers
              run: make build

            - name: Run unit tests
              run: make test

